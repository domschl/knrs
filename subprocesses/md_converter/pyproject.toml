[project]
name = "md_converter"
version = "0.1.0"
description = "Linux PDF and EPUB to Markdown converter using Docling and Pandoc"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.84.0",
    "onnxruntime>=1.26.0",
    "pycryptodome>=3.23.0",
    "pypdf>=6.9.2",
    "torch>=2.10.0",
    "torchvision",
]


[project.scripts]
md_converter = "md_converter:main"
