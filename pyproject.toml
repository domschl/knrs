[project]
name = "knrs"
version = "0.1.0"
description = "LLM-enabled knowledge-base wiki synthesising EbookTools, LocalResearch, and Summarizer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "pillow>=10.0.0",
    "numpy>=2.0.0",
    "beautifulsoup4>=4.14.3",
]

[project.scripts]
knrs = "knrs.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
