[project]
name = "knrs"
version = "0.1.0"
description = "LLM-enabled knowledge-base wiki synthesising EbookTools, LocalResearch, and Summarizer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "pillow>=10.0.0",
    "numpy>=2.0.0",
    "beautifulsoup4>=4.14.3",
]

[project.scripts]
knrs = "knrs:main"

[tool.hatch.build.targets.wheel]
packages = [
    "agent",
    "calibre",
    "external_lib",
    "repl",
    "subprocesses",
    "summarizer",
    "timelines",
    "utils",
    "vector",
    "wiki",
]

[tool.hatch.build.targets.wheel.force-include]
"config.py" = "config.py"
"logging_setup.py" = "logging_setup.py"
"naming.py" = "naming.py"
"paths.py" = "paths.py"
"knrs.py" = "knrs.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
