[project]
name = "agent-hf"
version = "0.1.0"
description = "HuggingFace Transformers agent backend"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.50.0",
    "torch>=2.10.0",
    "accelerate",
    "bitsandbytes>=0.43.0",
    "rich",
    "agent_core",
    "summarizer_core",
]

[tool.uv.sources]
agent_core = { path = "../agent_core", editable = true }
summarizer_core = { path = "../summarizer_core", editable = true }

[project.scripts]
agent-hf = "agent_hf:main"
