[project]
name = "embedder_hf"
version = "0.1.0"
dependencies = [
    "sentence-transformers>=3.0.0",
    "numpy>=2.0.0",
    "torch",
]

[project.optional-dependencies]
xpu = ["torch"]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-xpu", extra = "xpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
