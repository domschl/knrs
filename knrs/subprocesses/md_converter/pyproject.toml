[project]
name = "md_converter"
version = "0.1.0"
description = "Linux PDF and EPUB to Markdown converter using Docling and Pandoc"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.84.0",
    "pypdf>=6.9.2",
    "torch>=2.4.0",
]

[project.optional-dependencies]
xpu = ["torch"]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-xpu", marker = "extra == 'xpu'" }]

[project.scripts]
md_converter = "md_converter:main"
